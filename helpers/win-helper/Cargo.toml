[package]
name = "proton-informer-win-helper"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Audited Windows-side process helper for ProtonInformer"

[[bin]]
name = "proton-informer-win-helper"
path = "src/main.rs"

[dependencies]
proton-informer-helper-protocol = { path = "../../crates/helper-protocol" }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
