[workspace]
members = [".", "crates/helper-protocol", "helpers/win-helper"]
default-members = [".", "crates/helper-protocol", "helpers/win-helper"]
resolver = "3"

[package]
name = "proton-informer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Linux-native orchestration and validation for Proton and Wine mod loading"
default-run = "proton-informer"

[features]
default = []
# Native process loading is intentionally opt-in because ptrace-style loaders
# have a larger reliability and security surface than Wine helper orchestration.
native-elf = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
goblin = "0.10.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
uuid = { version = "1.23.2", features = ["v4"] }
wait-timeout = "0.2.1"
proton-informer-helper-protocol = { path = "crates/helper-protocol" }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
