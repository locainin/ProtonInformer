name: Release artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  windows-helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: i686-pc-windows-gnu
            output: proton-informer-win32-helper.exe
          - target: x86_64-pc-windows-gnu
            output: proton-informer-win-helper.exe
    steps:
      - uses: actions/checkout@v6
      - name: Install MinGW toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mingw-w64 gcc-mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build helper
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/src
            --remap-path-prefix=/home/runner/.cargo/registry=/cargo/registry
            --remap-path-prefix=/home/runner/.cargo/git=/cargo/git
        run: >-
          cargo build --locked -p proton-informer-win-helper
          --target "${{ matrix.target }}" --release
      - name: Package helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          source="target/${{ matrix.target }}/release/proton-informer-win-helper.exe"
          output="dist/${{ matrix.output }}"
          cp "$source" "$output"

          case "${{ matrix.target }}" in
            i686-pc-windows-gnu)
              i686-w64-mingw32-strip "$output"
              ;;
            x86_64-pc-windows-gnu)
              x86_64-w64-mingw32-strip "$output"
              ;;
          esac

          sha256sum "$output" > "$output.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: proton-informer-helper-${{ matrix.target }}
          path: dist/

  linux-package:
    needs: windows-helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux controller
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/src
            --remap-path-prefix=/home/runner/.cargo/registry=/cargo/registry
            --remap-path-prefix=/home/runner/.cargo/git=/cargo/git
        run: cargo build --locked -p proton-informer --release
      - name: Download helper artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: proton-informer-helper-*
          path: helper-artifacts
          merge-multiple: true
      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-dev}"
          package="proton-informer-${version}-linux-x86_64"

          mkdir -p "dist/${package}/helpers"
          cp target/release/proton-informer "dist/${package}/proton-informer"
          cp helper-artifacts/* "dist/${package}/helpers/"

          if [ -f README.md ]; then
            cp README.md "dist/${package}/README.md"
          fi

          if [ -f LICENSE ]; then
            cp LICENSE "dist/${package}/LICENSE"
          fi

          tar -C dist -czf "${package}.tar.gz" "${package}"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

          mkdir -p upload
          mv "${package}.tar.gz" "${package}.tar.gz.sha256" upload/
      - name: Smoke test release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf upload/*.tar.gz -C smoke
          archive_root="$(find smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_root"
          "$archive_root/proton-informer" --version
          "$archive_root/proton-informer" --help
          "$archive_root/proton-informer" verify-install --arch x86-64
          "$archive_root/proton-informer" verify-install --arch x86
      - uses: actions/upload-artifact@v7
        with:
          name: proton-informer-linux-x86_64
          path: upload/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proton-informer-linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
